- name: configuring rabbitmq server
  hosts: rabbitmq
  become: yes
  tasks: 
    - name: copy rabbitmq repo
      copy:
        src: rabbitmq.repo
        dest: /etc/yum.repos.d/rabbitmq.repo
    - name: install the rabbitmq server
      package:
        name: rabbitmq-server
        state: present
    - name: start and enable rabbitmq-server
      service: 
        name: rabbitmq-server
        state: started
        enabled: yes
    - name: create roboshopmq server
      community.rabbitmq.rabbitmq_user:
         user: roboshop
      password: roboshop123
      permissions:
        - vhost: /
          configure_priv: .*
          read_priv: .*
          write_priv: .*
      state: present