- name: configure the cart
  hosts: cart
  become: yes
  tasks:
    - name: enable nodejs 20
      command: dnf module enable nodejs:20 -y
    - name: install the nodejs 
      package: 
        name: nodejs
        state: present
    - name: create systemuser
      user:
        name: roboshop
        system: true
        home: /app
        shell: /sbin/nologin
        comment: "roboshop system user"
    - name: delete /app directory
      file: 
        path: /app
        state: absent
    - name: delete cart.zip 
      file:
        path: /tmp/cart.zip
        state: absent
    - name: create a app directory
      file:
        path: /app
        state: directory
    - name: download cart code
      get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
        dest: /tmp/cart.zip
    - name: unzip cart
      unarchive:
        src: /tmp/cart.zip
        dest: /app
        remote_src: yes
    - name: install dependencies 
      community.general.npm: 
        path: /app
    - name: copy cart service
      template:
        src: cart.service.j2
        dest: /etc/systemd/system/cart.service
    - name: daemon reload
      systemd_service: 
        name: cart
        daemon_reload: true
    - name: restart the cart service
      service:
        name: cart
        state: restarted
        enabled: yes