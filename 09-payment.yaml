- name: configure payment
  hosts: payment
  become: yes
  tasks: 
    - name: install phyton
      package: 
        name: "{{ item }}"
        state: present
      loop:
      - python3 
      - gcc 
      - python3-devel
    - name: create the roboshop user
      user:
        name: roboshop
        system: true
        home: /app
        shell: /sbin/nologin
        comment: "roboshop system user"
    - name: remove /app 
      file: 
        path: /app
        state: absent
    - name: delete payment.zip directory
      file: 
        path: /tmp/payment.zip
        state: directory
    - name: create /app directory
      file:
        path: /app
        state: directory
    - name: download payment
      get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip 
        dest: /tmp/payment.zip
    - name: unarchive the payment.zip
      unarchive:
        src: /tmp/payment.zip
        dest: /app
        remote_src: yes
    - name: install dependencies
      pip: 
        requirements: requirements.txt
        executable: pip3.9
      args:
        chdir: /app
    - name: copy payment service
      template:
        src: payment.service.j2
        dest: /etc/systemd/system/payment.service
    - name: deamon reload
      systemd_service:
        name: payment
        daemon_reload: true
    - name: enable and restart payment
      service:
        name: payment
        state: restarted
        enabled: yes